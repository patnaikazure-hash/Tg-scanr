<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Tools</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;padding:24px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  h1{font-size:1.5rem;color:#ff6b35;margin-bottom:6px;text-align:center}
  .sub{font-size:0.75rem;color:#555;margin-bottom:32px;text-align:center}
  .tools{display:flex;flex-direction:column;gap:14px;width:100%;max-width:400px}
  a.tool{display:block;background:#161616;border:1px solid #252525;border-radius:12px;padding:18px;text-decoration:none;color:#e0e0e0;transition:border-color 0.2s}
  a.tool:active{opacity:0.7}
  a.tool.fire{border-left:4px solid #ff6b35}
  a.tool.tg{border-left:4px solid #2AABEE}
  .tool-icon{font-size:1.6rem;margin-bottom:6px}
  .tool-name{font-size:1rem;font-weight:700;margin-bottom:4px}
  .tool-desc{font-size:0.72rem;color:#666}
</style>
</head>
<body>
<h1>🔥 Firebase Tools</h1>
<p class="sub">by patnaikazure-hash</p>
<div class="tools">
  <a class="tool fire" href="firebase_checker.html">
    <div class="tool-icon">🔥</div>
    <div class="tool-name">Firebase Checker</div>
    <div class="tool-desc">Paste Firebase URLs — check live/dead, total devices, active count. Super fast parallel scan.</div>
  </a>
  <a class="tool tg" href="tg_firebase_scanner.html">
    <div class="tool-icon">✈️</div>
    <div class="tool-name">TG Firebase Scanner</div>
    <div class="tool-desc">Login to Telegram, scan all chats for Firebase links, auto-check every link found.</div>
  </a>
</div>
</body>
</html>
