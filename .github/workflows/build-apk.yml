name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build GramJS browser bundle
      run: |
        cd gramjs-bundle
        npm install
        npm run build
        ls -lah dist/
        cp dist/telegram.bundle.js ../app/src/main/assets/public/telegram.bundle.js
        echo "Bundle copied to assets"

    - name: Accept Android SDK licenses and install components
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Install Gradle 8.6
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp/gradle-install
        export PATH="/tmp/gradle-install/gradle-8.6/bin:$PATH"
        echo "/tmp/gradle-install/gradle-8.6/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Find and copy APK
      run: |
        mkdir -p output
        find app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} output/TgFirebaseScanner.apk
        ls -lah output/

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: TgFirebaseScanner-APK
        path: output/TgFirebaseScanner.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.${{ github.run_number }}
        name: "TG Firebase Scanner v2.${{ github.run_number }}"
        body: |
          ## TG Firebase Scanner APK — Fully On-Device

          No server needed. Everything runs on your phone.

          **Install:**
          1. Download `TgFirebaseScanner.apk`
          2. Enable "Install from unknown sources" in Android settings
          3. Install and open the app
          4. Go to **Login** tab → enter phone → get OTP → verify
          5. Go to **Dashboard** → tap **Scan Now**

          **Features:**
          - Connects to Telegram directly from your phone
          - Scans all chats for Firebase links
          - Checks each Firebase link (live/dead, key counts)
          - Session saved on device — login once, scan forever
        files: output/TgFirebaseScanner.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
