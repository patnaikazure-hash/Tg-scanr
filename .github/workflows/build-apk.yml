name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Gradle execute permission
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Rename APK
      run: |
        mkdir -p output
        cp app/build/outputs/apk/release/app-release-unsigned.apk output/TgFirebaseScanner.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: TgFirebaseScanner-APK
        path: output/TgFirebaseScanner.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.${{ github.run_number }}
        name: "TG Firebase Scanner v1.${{ github.run_number }}"
        body: |
          ## TG Firebase Scanner APK

          **Install:** Download `TgFirebaseScanner.apk` and install on your Android phone.

          > Enable "Install from unknown sources" in Android settings first.

          **What it does:**
          - Connects to your Railway scanner backend
          - Shows all Firebase links found in Telegram
          - Live/dead status + device counts
          - Auto-refreshes every 10 seconds
        files: output/TgFirebaseScanner.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
