name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Accept Android SDK licenses and install components
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Generate Gradle wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Grant Gradle execute permission
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

    - name: Find and copy APK
      run: |
        mkdir -p output
        find app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} output/TgFirebaseScanner.apk
        ls -lah output/

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: TgFirebaseScanner-APK
        path: output/TgFirebaseScanner.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.${{ github.run_number }}
        name: "TG Firebase Scanner v1.${{ github.run_number }}"
        body: |
          ## TG Firebase Scanner APK

          **Install:** Download `TgFirebaseScanner.apk` and install on Android.

          > Enable "Install from unknown sources" in Android settings first.

          **Features:**
          - Connects to your Railway backend
          - Shows Firebase links found in Telegram
          - Live/dead status + device counts
          - Auto-refreshes every 10 seconds
        files: output/TgFirebaseScanner.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
