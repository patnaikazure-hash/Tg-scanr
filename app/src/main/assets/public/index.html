<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TG Firebase Scanner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e0e;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --accent: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --text: #e5e5e5;
  --muted: #888;
}
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

/* tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
.tab { flex: 1; padding: 14px 8px; text-align: center; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: .2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* pages */
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.card-value { font-size: 22px; font-weight: 700; }

/* stats row */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

/* status badge */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge.live { background: rgba(74,222,128,.15); color: var(--accent); }
.badge.dead { background: rgba(248,113,113,.15); color: var(--red); }
.badge.checking { background: rgba(251,191,36,.15); color: var(--yellow); }

/* firebase link item */
.fb-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.fb-url { font-size: 12px; color: var(--accent); word-break: break-all; margin-bottom: 6px; }
.fb-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* button */
.btn { width: 100%; padding: 13px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s; }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-danger { background: var(--red); color: #fff; margin-top: 10px; }

/* input */
.input { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; }
.input:focus { border-color: var(--accent); }
label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }

/* log */
.log { background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 11px; font-family: monospace; max-height: 180px; overflow-y: auto; color: #aaa; }
.log p { margin-bottom: 3px; }
.log p.ok { color: var(--accent); }
.log p.err { color: var(--red); }
.log p.info { color: var(--yellow); }

.section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

/* scan button */
.scan-btn-wrap { margin-bottom: 16px; }
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: var(--accent); transition: width .3s; border-radius: 2px; }

.session-info { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px; word-break: break-all; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" onclick="showTab('dashboard')">Dashboard</div>
  <div class="tab" onclick="showTab('login')">Login</div>
  <div class="tab" onclick="showTab('settings')">Settings</div>
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="stats">
    <div class="card">
      <div class="card-title">Firebase Links</div>
      <div class="card-value" id="stat-total">0</div>
    </div>
    <div class="card">
      <div class="card-title">Live</div>
      <div class="card-value" style="color:var(--accent)" id="stat-live">0</div>
    </div>
    <div class="card">
      <div class="card-title">Dead</div>
      <div class="card-value" style="color:var(--red)" id="stat-dead">0</div>
    </div>
    <div class="card">
      <div class="card-title">Chats Scanned</div>
      <div class="card-value" id="stat-chats">0</div>
    </div>
  </div>

  <div class="scan-btn-wrap">
    <button class="btn btn-primary" id="scan-btn" onclick="startScan()">🔍 Scan Now</button>
    <div class="progress-bar" id="progress-bar" style="display:none">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="log" id="scan-log"><p>Ready. Press Scan Now to start.</p></div>

  <div style="margin-top:16px">
    <div class="section-title" id="results-title">Results</div>
    <div id="results-list"><div class="empty">No results yet</div></div>
  </div>
</div>

<!-- LOGIN -->
<div class="page" id="page-login">
  <div id="login-section">
    <div class="section-title">Telegram Login</div>

    <div id="saved-session" style="display:none">
      <div class="session-info" id="session-display"></div>
      <button class="btn btn-primary" onclick="showTab('dashboard')">✅ Already Logged In — Go Scan</button>
      <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
    </div>

    <div id="login-form">
      <label>Phone Number (with country code)</label>
      <input class="input" id="inp-phone" type="tel" placeholder="+919861992132" value="+919861992132">

      <div id="otp-section" style="display:none">
        <label>OTP Code from Telegram</label>
        <input class="input" id="inp-otp" type="number" placeholder="12345">
        <div id="pass-section" style="display:none">
          <label>2FA Password (if enabled)</label>
          <input class="input" id="inp-pass" type="password" placeholder="password">
        </div>
        <button class="btn btn-primary" id="verify-btn" onclick="verifyOTP()">Verify</button>
      </div>

      <div id="send-otp-wrap">
        <button class="btn btn-primary" id="send-btn" onclick="sendOTP()">Send OTP</button>
      </div>

      <div class="log" id="login-log" style="margin-top:12px"><p>Enter phone and tap Send OTP</p></div>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="section-title">Settings</div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-title">API Credentials</div>
    <label style="margin-top:8px">API ID</label>
    <input class="input" id="set-api-id" type="number" placeholder="18550618" value="18550618">
    <label>API Hash</label>
    <input class="input" id="set-api-hash" type="text" placeholder="your api hash" value="e98b922550a95f725dfc30e13571589f">
    <button class="btn btn-primary" onclick="saveSettings()">Save</button>
  </div>

  <div class="card">
    <div class="card-title">Scan Options</div>
    <label style="margin-top:8px; display:flex; align-items:center; gap:8px; cursor:pointer">
      <input type="checkbox" id="chk-check-firebase" checked style="width:16px;height:16px">
      Check Firebase liveness &amp; device counts
    </label>
    <label style="margin-top:10px; display:flex; align-items:center; gap:8px; cursor:pointer">
      <input type="checkbox" id="chk-all-chats" checked style="width:16px;height:16px">
      Scan all chats (uncheck = only groups/channels)
    </label>
  </div>
</div>

<script src="telegram.bundle.js"></script>
<script>
// ─── State ───────────────────────────────────────────────
const API_ID   = () => parseInt(document.getElementById('set-api-id').value)   || 18550618;
const API_HASH = () => document.getElementById('set-api-hash').value            || 'e98b922550a95f725dfc30e13571589f';

let client = null;
let phoneCodeHash = null;
let results = [];
let scanning = false;

// ─── Utils ───────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['dashboard','login','settings'];
    t.classList.toggle('active', names[i] === tab);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + tab);
  });
  if (tab === 'login') checkSavedSession();
}

function log(msg, type='', target='scan-log') {
  const el = document.getElementById(target);
  const p = document.createElement('p');
  p.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  if (type) p.className = type;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function saveSettings() {
  localStorage.setItem('api_id',   document.getElementById('set-api-id').value);
  localStorage.setItem('api_hash', document.getElementById('set-api-hash').value);
  alert('Settings saved!');
}

function checkSavedSession() {
  const sess = localStorage.getItem('tg_session');
  const saved = document.getElementById('saved-session');
  const form  = document.getElementById('login-form');
  if (sess) {
    saved.style.display = 'block';
    form.style.display  = 'none';
    document.getElementById('session-display').textContent = 'Session saved ✓ (' + sess.substring(0,30) + '…)';
  } else {
    saved.style.display = 'none';
    form.style.display  = 'block';
  }
}

function logout() {
  localStorage.removeItem('tg_session');
  if (client) { try { client.disconnect(); } catch(e){} client = null; }
  checkSavedSession();
  log('Logged out.', 'info');
}

// ─── GramJS client ───────────────────────────────────────
async function getClient() {
  if (client) return client;
  const { TelegramClient, StringSession } = window.GramJS;
  const sess = new StringSession(localStorage.getItem('tg_session') || '');
  client = new TelegramClient(sess, API_ID(), API_HASH(), {
    connectionRetries: 5,
    useWSS: true,
  });
  return client;
}

// ─── LOGIN ───────────────────────────────────────────────
async function sendOTP() {
  const phone = document.getElementById('inp-phone').value.trim();
  if (!phone) return alert('Enter phone number');

  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  log('Connecting to Telegram…', 'info', 'login-log');

  try {
    const c = await getClient();
    await c.connect();
    const result = await c.sendCode({ apiId: API_ID(), apiHash: API_HASH() }, phone);
    phoneCodeHash = result.phoneCodeHash;
    log('OTP sent! Check Telegram app.', 'ok', 'login-log');
    document.getElementById('otp-section').style.display = 'block';
    document.getElementById('send-otp-wrap').style.display = 'none';
  } catch(e) {
    log('Error: ' + e.message, 'err', 'login-log');
    btn.disabled = false; btn.textContent = 'Send OTP';
  }
}

async function verifyOTP() {
  const phone = document.getElementById('inp-phone').value.trim();
  const code  = document.getElementById('inp-otp').value.trim();
  const pass  = document.getElementById('inp-pass').value.trim();
  if (!code) return alert('Enter OTP code');

  const btn = document.getElementById('verify-btn');
  btn.disabled = true; btn.textContent = 'Verifying…';
  log('Verifying OTP…', 'info', 'login-log');

  try {
    const c = await getClient();
    try {
      await c.invoke(new window.GramJS.Api.auth.SignIn({
        phoneNumber: phone,
        phoneCodeHash: phoneCodeHash,
        phoneCode: code,
      }));
    } catch(e) {
      if (e.errorMessage === 'SESSION_PASSWORD_NEEDED') {
        log('2FA required — enter password below', 'info', 'login-log');
        document.getElementById('pass-section').style.display = 'block';
        btn.disabled = false; btn.textContent = 'Verify';
        return;
      }
      throw e;
    }

    const session = c.session.save();
    localStorage.setItem('tg_session', session);
    log('Login successful! Session saved.', 'ok', 'login-log');
    setTimeout(() => { showTab('dashboard'); checkSavedSession(); }, 1000);

  } catch(e) {
    log('Error: ' + e.message, 'err', 'login-log');
    btn.disabled = false; btn.textContent = 'Verify';
  }
}

// ─── SCAN ────────────────────────────────────────────────
function extractFirebaseUrls(text) {
  if (!text) return [];
  const re = /https?:\/\/([a-zA-Z0-9-]+)\.firebaseio\.com\b[^\s"']*/g;
  const matches = [...text.matchAll(re)];
  return matches.map(m => m[0].replace(/[^a-zA-Z0-9\-._~:/?#[\]@!$&'()*+,;=%]/g,''));
}

async function checkFirebase(url) {
  const base = url.replace(/\/+$/, '').split('?')[0];
  const checkUrl = base + '/.json?shallow=true&timeout=5s';
  try {
    const resp = await fetch(checkUrl, { signal: AbortSignal.timeout(6000) });
    if (resp.status === 200) {
      const data = await resp.json();
      if (data === null) return { status: 'live', devices: 0, activeDevices: 0 };
      const keys = Object.keys(data);
      let active = 0;
      // try to count devices
      const deviceKeys = keys.filter(k => /device|token|fcm|push|reg/i.test(k));
      active = deviceKeys.length;
      return { status: 'live', devices: keys.length, activeDevices: active };
    } else if (resp.status === 401 || resp.status === 403) {
      return { status: 'live', devices: '?', activeDevices: '?' };
    } else {
      return { status: 'dead', devices: 0, activeDevices: 0 };
    }
  } catch(e) {
    return { status: 'dead', devices: 0, activeDevices: 0 };
  }
}

function renderResults() {
  const el = document.getElementById('results-list');
  document.getElementById('results-title').textContent = 'Results (' + results.length + ')';
  document.getElementById('stat-total').textContent = results.length;
  document.getElementById('stat-live').textContent  = results.filter(r => r.status==='live').length;
  document.getElementById('stat-dead').textContent  = results.filter(r => r.status==='dead').length;

  if (!results.length) { el.innerHTML = '<div class="empty">No Firebase links found yet</div>'; return; }

  el.innerHTML = results.map(r => `
    <div class="fb-item">
      <div class="fb-url">${r.url}</div>
      <div class="fb-meta">
        <span class="badge ${r.status==='checking'?'checking':r.status==='live'?'live':'dead'}">
          ${r.status==='checking'?'⏳ checking':r.status==='live'?'✅ LIVE':'❌ DEAD'}
        </span>
        ${r.status!=='checking' ? `<span>📦 Keys: ${r.devices}</span><span>📱 Device keys: ${r.activeDevices}</span>` : ''}
        <span style="color:#555">from: ${r.chatTitle||'?'}</span>
      </div>
    </div>
  `).join('');
}

async function startScan() {
  if (scanning) return;
  const session = localStorage.getItem('tg_session');
  if (!session) {
    alert('Please login first! Go to Login tab.');
    showTab('login');
    return;
  }

  scanning = true;
  results = [];
  const btn = document.getElementById('scan-btn');
  btn.disabled = true; btn.textContent = '⏳ Scanning…';
  document.getElementById('scan-log').innerHTML = '';
  document.getElementById('progress-bar').style.display = 'block';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('stat-chats').textContent = '0';
  renderResults();

  try {
    log('Connecting…', 'info');
    const c = await getClient();
    await c.connect();
    log('Connected ✓', 'ok');

    log('Fetching dialogs…', 'info');
    const checkAll = document.getElementById('chk-all-chats').checked;
    const dialogs = await c.getDialogs({ limit: 500 });
    log('Found ' + dialogs.length + ' chats', 'info');

    const seen = new Set();
    let chatsDone = 0;

    for (const dialog of dialogs) {
      const entity = dialog.entity;
      if (!entity) continue;
      const title = dialog.title || dialog.name || 'Chat';

      // skip private DMs if setting unchecked
      if (!checkAll) {
        const isPrivate = entity.className === 'User';
        if (isPrivate) continue;
      }

      try {
        const msgs = await c.getMessages(entity, { limit: 100 });
        for (const msg of msgs) {
          const text = msg.message || msg.text || '';
          const urls = extractFirebaseUrls(text);
          for (const url of urls) {
            const key = url.split('?')[0].toLowerCase();
            if (seen.has(key)) continue;
            seen.add(key);
            const item = { url, chatTitle: title, status: 'checking', devices: 0, activeDevices: 0 };
            results.push(item);
            renderResults();
            log('Found: ' + url.substring(0,50), 'ok');
          }
        }
      } catch(e) { /* skip inaccessible chats */ }

      chatsDone++;
      document.getElementById('stat-chats').textContent = chatsDone;
      const pct = Math.round((chatsDone / dialogs.length) * 80);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    log('Scan done! Found ' + results.length + ' unique links. Checking Firebase…', 'info');

    // check firebase liveness
    if (document.getElementById('chk-check-firebase').checked) {
      for (let i = 0; i < results.length; i++) {
        const info = await checkFirebase(results[i].url);
        results[i] = { ...results[i], ...info };
        renderResults();
        document.getElementById('progress-fill').style.width = (80 + Math.round((i+1)/results.length*20)) + '%';
      }
    } else {
      results.forEach(r => r.status = 'live');
    }

    log('All done! ' + results.filter(r=>r.status==='live').length + ' live, ' + results.filter(r=>r.status==='dead').length + ' dead', 'ok');
    document.getElementById('progress-fill').style.width = '100%';
    setTimeout(() => document.getElementById('progress-bar').style.display = 'none', 2000);

  } catch(e) {
    log('Error: ' + e.message, 'err');
  }

  scanning = false;
  btn.disabled = false; btn.textContent = '🔍 Scan Now';
  renderResults();
}

// ─── Init ─────────────────────────────────────────────────
(function init() {
  const savedId   = localStorage.getItem('api_id');
  const savedHash = localStorage.getItem('api_hash');
  if (savedId)   document.getElementById('set-api-id').value   = savedId;
  if (savedHash) document.getElementById('set-api-hash').value = savedHash;

  const sess = localStorage.getItem('tg_session');
  if (sess) {
    log('Session found. Ready to scan!', 'ok');
  } else {
    log('No session. Go to Login tab first.', 'info');
  }
})();
</script>
</body>
</html>
